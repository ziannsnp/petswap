name: Database contract

# Spins up a local Supabase stack, rebuilds it from migrations + seed, and runs
# the SQL contract checks in supabase/tests/. This is deliberately NOT part of the
# required Quality gate (see docs/testing.md): it boots containers and is slower,
# so it runs only when something under supabase/ changes, on a weekly schedule,
# and on demand. Treat a red result as a blocker for merging a schema change even
# though branch protection does not enforce it yet.

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/config.toml'
      - 'supabase/tests/**'
      - '.github/workflows/db-contract.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC, before the week's work starts

concurrency:
  group: db-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Reset local database and run contract checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4

      # Use the CLI version that local `npx supabase` gets from web/package-lock.json,
      # so CI only moves to a new release (such as v3) when the team upgrades it.
      - name: Read the Supabase CLI version from web/package-lock.json
        id: supabase-cli
        run: |
          version=$(jq -r '.packages["node_modules/supabase"].version' web/package-lock.json)
          if [ -z "$version" ] || [ "$version" = null ]; then
            echo "::error::No supabase package in web/package-lock.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ steps.supabase-cli.outputs.version }}

      - name: Start local Supabase stack
        run: supabase start

      - name: Rebuild database from migrations and seed
        run: supabase db reset

      - name: Schema contract checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/database_contract.sql

      - name: Booking rules behavioural checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/booking_rules.test.sql

      - name: Booking lifecycle behavioural checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/booking_lifecycle.test.sql

      - name: Booking transition rules behavioural checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/booking_transition_rules.test.sql

      - name: Listing rules behavioural checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/listing_rules.test.sql

      - name: Listing facility migration checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/listing_facility_migration.test.sql

      - name: Listing photo access behavioural checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/listing_photo_access.test.sql

      - name: Listing host access behavioural checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/listing_host_access.test.sql

      - name: Listing edit behavioural checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/listing_edit_rules.test.sql

      - name: Listing deletion behavioural checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/listing_deletion.test.sql

      - name: Listing search and pagination checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/listing_search.test.sql

      - name: Listing filters and availability privacy checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/listing_search_filters.test.sql

      - name: Avatar storage access behavioural checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/avatar_storage_access.test.sql

      - name: Pet photo access behavioural checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/pet_photo_access.test.sql

      - name: Host access to booked pets behavioural checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/host_pet_access.test.sql

      - name: Profile rules behavioural checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/profile_rules.test.sql

      - name: Pet rules behavioural checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/pet_rules.test.sql

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop || true
