name: Database contract

# Spins up a local Supabase stack, rebuilds it from migrations + seed, and runs
# the SQL contract checks in supabase/tests/. This is deliberately NOT part of the
# required Quality gate (see docs/testing.md): it boots containers and is slower,
# so it runs only when something under supabase/ changes, on a weekly schedule,
# and on demand. Treat a red result as a blocker for merging a schema change even
# though branch protection does not enforce it yet.

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/config.toml'
      - 'supabase/tests/**'
      - '.github/workflows/db-contract.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC, before the week's work starts

concurrency:
  group: db-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Reset local database and run contract checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7

      # Use the CLI version that local `npx supabase` gets from web/package-lock.json,
      # so CI only moves to a new release (such as v3) when the team upgrades it.
      - name: Read the Supabase CLI version from web/package-lock.json
        id: supabase-cli
        run: |
          version=$(jq -r '.packages["node_modules/supabase"].version' web/package-lock.json)
          if [ -z "$version" ] || [ "$version" = null ]; then
            echo "::error::No supabase package in web/package-lock.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ steps.supabase-cli.outputs.version }}

      - name: Start local Supabase stack
        run: supabase start

      - name: Rebuild database from migrations and seed
        run: supabase db reset

      # Run every SQL check under supabase/tests/ instead of naming each file, so a new
      # *.test.sql can never be left out of CI by forgetting to add a step. The schema
      # contract goes first, then the rest in name order. Every file runs even if an
      # earlier one fails, so one red run lists all failures; the step fails at the end.
      - name: Run every SQL contract and behaviour check
        run: |
          failed=0
          for file in supabase/tests/database_contract.sql $(ls supabase/tests/*.test.sql | sort); do
            echo "::group::$file"
            if ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"; then
              echo "::error file=$file::SQL check failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      # Two real database sessions race confirmations and capacity edits (ADR 0011); a single
      # psql session cannot reproduce that, so it is a script rather than a *.test.sql file.
      - name: Concurrent confirmations and capacity edits
        run: python3 supabase/tests/booking_concurrency.test.py --database-url "$DATABASE_URL"

      # Static checks of the database functions. `--level error` keeps this from failing on
      # advisory warnings in existing code; tighten to `warning` once the baseline is clean.
      - name: Lint database functions
        run: supabase db lint --level error

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop || true
