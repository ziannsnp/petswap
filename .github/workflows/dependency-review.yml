name: Dependency review

# Blocks a pull request that adds a dependency with a known high-severity vulnerability.
# Uses the GitHub dependency graph, free for public repositories. Not a required check yet.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Needs the repository's Dependency graph (Settings > Code security), which only an admin
      # can enable. Until it is on, the action reports "not supported" instead of reviewing, so
      # the step must not turn every pull request red. Remove continue-on-error once it is on.
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high
