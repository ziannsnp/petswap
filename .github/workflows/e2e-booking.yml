name: E2E booking

# Runs the Playwright booking journeys (e2e/booking-flow.spec.ts and
# e2e/booking-lifecycle.spec.ts) against a local Supabase stack started on the runner,
# so nobody needs Docker on their own machine and the shared hosted project is never
# touched. Like E2E smoke, it boots containers and a browser, so it is informational
# rather than part of the required Quality gate. A red run means a booking journey
# regressed and the change author owns the fix.

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/src/features/bookings/**'
      - 'web/src/features/auth/**'
      - 'web/e2e/**'
      - 'web/playwright.config.ts'
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/config.toml'
      - '.github/workflows/e2e-booking.yml'
  workflow_dispatch:

concurrency:
  group: e2e-booking-${{ github.ref }}
  cancel-in-progress: true

jobs:
  booking:
    name: Booking journeys against local Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0 # keep in step with web/package-lock.json; "latest" calls the rate-limited GitHub API

      # Local-only origin allowlist for the sign-in Edge Function (see docs/testing.md).
      - name: Configure local Edge Function environment
        run: cp supabase/functions/.env.example supabase/functions/.env

      - name: Start local Supabase stack
        run: supabase start

      - name: Rebuild database from migrations and seed
        run: supabase db reset

      # The local anon key is generated by `supabase start`, not a secret.
      - name: Point the app at the local stack
        run: |
          eval "$(supabase status -o env)"
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$API_URL" "$ANON_KEY" > web/.env.local

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium firefox

      - name: Run booking journeys
        working-directory: web
        run: npx playwright test e2e/booking-flow.spec.ts e2e/booking-lifecycle.spec.ts

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-booking-report
          path: web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop || true
