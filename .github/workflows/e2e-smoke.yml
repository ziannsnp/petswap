name: E2E smoke

# Runs the public-route Playwright smoke suite (e2e/smoke.spec.ts) on desktop and
# mobile Chromium. Separate from the required Quality gate: it installs a browser
# and starts the dev server, so it is informational for now. A red run still
# means the app shell or router regressed.

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/e2e-smoke.yml'
  workflow_dispatch:

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Public route smoke (desktop + mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/smoke.spec.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
