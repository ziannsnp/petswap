name: Quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/pull_request_template.md'
      - '.github/workflows/quality.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/pull_request_template.md'
      - '.github/workflows/quality.yml'

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run build

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify documentation links resolve
        shell: python
        run: |
          import pathlib
          import re
          import sys
          import urllib.parse

          root = pathlib.Path('.').resolve()
          pattern = re.compile(r'\]\(([^)\s]+)\)')
          failures = []
          checked = 0

          for document in sorted((root / 'docs').rglob('*.md')):
              for raw_link in pattern.findall(document.read_text(encoding='utf-8')):
                  if raw_link.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  target = raw_link.split('#', 1)[0]
                  if not target:
                      continue
                  resolved = (document.parent / urllib.parse.unquote(target)).resolve()
                  checked += 1
                  if not resolved.exists():
                      failures.append(f'{document.relative_to(root)}: {raw_link}')

          print(f'checked {checked} documentation links')
          if failures:
              print('Broken documentation links:')
              print('\n'.join(failures))
              sys.exit(1)

# CD Pipeline for Supabase DB Push
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      supabase: ${{ steps.filter.outputs.supabase }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            supabase:
              - 'supabase/**'

  supabase-migration:
    name: Supabase DB Push
    runs-on: ubuntu-latest
    needs: changes
    # The workflow-level `push.paths` filter above also matches docs/**, README.md,
    # and AGENTS.md, so a documentation-only push to main still triggers this job
    # unless it re-checks that supabase/** actually changed. Without this guard,
    # a docs PR silently runs `supabase db push` against the real database.
    if: github.event_name == 'push' && needs.changes.outputs.supabase == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy DB Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_ID
          supabase db push --include-all
