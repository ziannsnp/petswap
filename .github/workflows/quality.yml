name: Quality

on:
  # No `paths` filter on pull requests: `web-quality` and `docs-links` are meant
  # to be required status checks, and GitHub leaves a required check stuck on
  # "Expected" forever when its workflow never starts. Every PR to main must
  # therefore get both jobs, even one that only touches docker/** or another
  # workflow. See docs/ci-cd.md#required-checks.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/pull_request_template.md'
      - '.github/workflows/quality.yml'
      - '.github/rulesets/**'
      - 'scripts/release_gate.py'

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage -- --runInBand
      - name: Show coverage in the job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Jest coverage (report only, no gate yet)'
            echo
            echo '| Metric | Covered | Total | % |'
            echo '| --- | --- | --- | --- |'
            node -e "const t=require('./coverage/coverage-summary.json').total;for(const k of ['lines','statements','functions','branches'])console.log('| '+k+' | '+t[k].covered+' | '+t[k].total+' | '+t[k].pct+' |')"
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify documentation links resolve
        shell: python
        run: |
          import pathlib
          import re
          import sys
          import urllib.parse

          root = pathlib.Path('.').resolve()
          pattern = re.compile(r'\]\(([^)\s]+)\)')
          failures = []
          checked = 0

          for document in sorted((root / 'docs').rglob('*.md')):
              for raw_link in pattern.findall(document.read_text(encoding='utf-8')):
                  if raw_link.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  target = raw_link.split('#', 1)[0]
                  if not target:
                      continue
                  resolved = (document.parent / urllib.parse.unquote(target)).resolve()
                  checked += 1
                  if not resolved.exists():
                      failures.append(f'{document.relative_to(root)}: {raw_link}')

          print(f'checked {checked} documentation links')
          if failures:
              print('Broken documentation links:')
              print('\n'.join(failures))
              sys.exit(1)

  # Repository-level checks that need no Node install: they keep documentation, the API
  # description, and test wiring honest. Cheap, so it runs on every pull request.
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every acceptance scenario names an existing test
        run: bash scripts/check-acceptance-traceability.sh
      - name: Every e2e spec is run by a workflow, and SQL tests run by glob
        run: bash scripts/check-test-wiring.sh
      - name: OpenAPI description is valid
        run: |
          pip install --quiet openapi-spec-validator==0.7.1
          openapi-spec-validator docs/api/openapi.yaml

  # Release gate (US-D.5). On every push to main that Quality runs for, read the
  # conclusion of each required check on the pull request that produced the commit,
  # write a release record (job summary + JSON artifact), and fail when any required
  # check did not pass. `Supabase DB Push` needs this job, so a failed gate blocks
  # the only publish GitHub Actions performs. The web app is published by
  # Cloudflare's Git integration (ADR 0005), which does not wait for this job; its
  # gate is the required checks on pull requests to protected main. See
  # docs/ci-cd.md#release-gate.
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    needs: [web-quality, docs-links, repo-checks]
    # Runs even when a Quality job failed on the pushed commit, so the record is
    # still written; the last step then fails the gate.
    if: github.event_name == 'push' && !cancelled()
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Check the required checks of the merged pull request and write the release record
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release_gate.py --record release-record.json
      - name: Check Quality passed on the pushed commit
        env:
          WEB_QUALITY: ${{ needs.web-quality.result }}
          DOCS_LINKS: ${{ needs.docs-links.result }}
          REPO_CHECKS: ${{ needs.repo-checks.result }}
        run: |
          {
            echo
            echo '| Quality on the pushed commit | Result |'
            echo '| --- | --- |'
            echo "| web-quality | $WEB_QUALITY |"
            echo "| docs-links | $DOCS_LINKS |"
            echo "| repo-checks | $REPO_CHECKS |"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$WEB_QUALITY" "$DOCS_LINKS" "$REPO_CHECKS"; do
            if [ "$result" != success ]; then
              echo "::error::Release blocked: a Quality job did not pass on the pushed commit."
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: release-record-${{ github.sha }}
          path: release-record.json
          retention-days: 90
          if-no-files-found: ignore

# CD Pipeline for Supabase DB Push
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      supabase: ${{ steps.filter.outputs.supabase }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            supabase:
              - 'supabase/**'

  supabase-migration:
    name: Supabase DB Push
    runs-on: ubuntu-latest
    # Needs the release gate: when any required check failed, `release-gate` fails
    # and this job is skipped, so nothing is pushed to the hosted database.
    needs: [changes, release-gate]
    # The workflow-level `push.paths` filter above also matches docs/**, README.md,
    # and AGENTS.md, so a documentation-only push to main still triggers this job
    # unless it re-checks that supabase/** actually changed. Without this guard,
    # a docs PR silently runs `supabase db push` against the real database.
    if: github.event_name == 'push' && needs.changes.outputs.supabase == 'true'

    steps:
      - uses: actions/checkout@v7

      # Use the CLI version that local `npx supabase` gets from web/package-lock.json,
      # so CI only moves to a new release (such as v3) when the team upgrades it.
      - name: Read the Supabase CLI version from web/package-lock.json
        id: supabase-cli
        run: |
          version=$(jq -r '.packages["node_modules/supabase"].version' web/package-lock.json)
          if [ -z "$version" ] || [ "$version" = null ]; then
            echo "::error::No supabase package in web/package-lock.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ steps.supabase-cli.outputs.version }}

      - name: Deploy DB Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_ID
          supabase db push --include-all

      # No function name given: the CLI deploys every function under
      # supabase/functions/, so a new function only needs its folder -- no
      # second place to remember to wire it into CI, which is exactly the gap
      # that left `sign-in` undeployed since it was written.
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_ID
          supabase functions deploy
