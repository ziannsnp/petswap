openapi: 3.0.3
info:
  title: PetSwap API
  version: 1.0.0
  description: |
    The HTTP surface the PetSwap web app uses. PetSwap has no application server of its own;
    the browser calls Supabase directly, so this document describes three kinds of endpoint:

    1. **Edge Function** `sign-in`, the only custom code (username sign-in).
    2. **Database functions** exposed by PostgREST as `POST /rest/v1/rpc/<name>`.
    3. **Tables** exposed by PostgREST as `/rest/v1/<table>`, summarised below.

    Authorization is **not** done by the API layer. Row Level Security and triggers in Postgres
    decide who can read or change each row; a request the caller may not make returns an empty
    result, `403`, or a database error. The `x-rls` notes state each rule in plain words, and
    `supabase/tests/*.test.sql` tests them.

    Not described: Supabase Auth's own endpoints (`/auth/v1/signup`, `/auth/v1/token`, and so on)
    and Storage (`/storage/v1/object/...`); they are the platform's documented API. Buckets used:
    `avatars` (public read), `pet-photos` (private), `listing-photos` (private, signed URLs).

    The tables section is a hand-maintained summary. The full generated schema of the live
    project is served by PostgREST itself at `GET /rest/v1/` (with the publishable key).
servers:
  - url: https://gqtdnckwubfdghynavwg.supabase.co
    description: Hosted demo and production project
  - url: http://127.0.0.1:54321
    description: Local stack (`npx supabase start`)
tags:
  - name: Auth
  - name: Listings
  - name: Pets
  - name: Bookings
  - name: Profiles
security:
  - publishableKey: []
paths:
  /functions/v1/sign-in:
    post:
      tags: [Auth]
      operationId: signInWithUsername
      summary: Sign in with a username and password
      description: |
        Resolves the username to an account on the server and signs in, so the browser never learns
        the email behind a username. An unknown username and a wrong password return the same
        error. Browser origins must be on the function's allow list; a request from another origin
        gets `403`.
      security:
        - publishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  pattern: '^[a-z0-9_]{3,30}$'
                  description: Trimmed and lower-cased by the server.
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
      responses:
        '200':
          description: Signed in. The client then calls `auth.setSession` with these tokens.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, refreshToken]
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
        '400': { $ref: '#/components/responses/SignInError' }
        '401': { $ref: '#/components/responses/SignInError' }
        '403':
          description: Email not confirmed, or origin not allowed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignInError' }
        '405': { $ref: '#/components/responses/SignInError' }
        '429': { $ref: '#/components/responses/SignInError' }
        '500': { $ref: '#/components/responses/SignInError' }

  /rest/v1/rpc/is_username_available:
    post:
      tags: [Auth]
      operationId: isUsernameAvailable
      summary: Check whether a username is free (registration form)
      x-rls: Callable by anyone, including signed-out visitors; returns only a boolean.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidate_username]
              properties:
                candidate_username: { type: string }
      responses:
        '200':
          description: '`true` when the username is valid and unused.'
          content:
            application/json:
              schema: { type: boolean }

  /rest/v1/rpc/search_published_listings:
    post:
      tags: [Listings]
      operationId: searchPublishedListings
      summary: Search published listings with filters, sorting, and pagination
      description: |
        Filtering happens before counting, page clamping, ordering, and slicing. A
        date-filtered search keeps a listing while its peak number of **confirmed** bookings on
        any night of the range is below its capacity; pending and terminal bookings never count.
        The date range is end-exclusive, so back-to-back stays are allowed. The result carries no
        booking details, dates, or counts. Design reasoning: ADR 0010 and ADR 0011.
      x-rls: Public. Runs as a restricted security-definer read with an empty search path and explicit published and not-deleted checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_location, p_keyword, p_page, p_page_size]
              properties:
                p_location: { type: string, nullable: true }
                p_keyword: { type: string, nullable: true }
                p_page: { type: integer, minimum: 1 }
                p_page_size: { type: integer, minimum: 1 }
                p_sort:
                  type: string
                  enum: [newest, oldest, title, capacity]
                  default: newest
                p_pet_type: { $ref: '#/components/schemas/PetSpecies' }
                p_min_capacity: { type: integer, minimum: 1, nullable: true }
                p_start_date: { type: string, format: date, nullable: true }
                p_end_date:
                  type: string
                  format: date
                  nullable: true
                  description: Must be later than `p_start_date` when both are given.
      responses:
        '200':
          description: One page of listings; every row repeats `page_number` and `total_count`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ListingSearchRow' }
        '400': { $ref: '#/components/responses/DatabaseError' }

  /rest/v1/rpc/get_listing_host:
    post:
      tags: [Listings, Profiles]
      operationId: getListingHost
      summary: Public host summary for a published listing
      x-rls: Public for published listings, and for the owner of a draft. A draft's host profile is not readable by anyone else.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_listing_id]
              properties:
                target_listing_id: { type: string, format: uuid }
      responses:
        '200':
          description: Zero or one row.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    display_name: { type: string }
                    photo_url: { type: string, nullable: true }
                    location: { type: string, nullable: true }

  /rest/v1/rpc/get_booking_detail:
    post:
      tags: [Bookings]
      operationId: getBookingDetail
      summary: One booking for its two participants
      description: |
        Returns the booking, its listing, the pet with care notes, and the other participant's safe
        profile (ADR 0011 decision 7). The requester sees the host; the listing owner sees the requester.
        The pet is returned to the requester always (soft-deleted pets included, marked by `pet_deleted`)
        and to the host only while the booking is pending, confirmed or completed; after a decline or a
        cancellation the `pet_*` columns are null. A draft or deleted listing still returns its bookings.
        No email address or phone number is ever returned.
      x-rls: Requester and the owner of the booked listing only. Anyone else, and an unknown id, get zero rows, so a missing booking and someone else's look the same. Anonymous callers have no execute right.
      security:
        - userJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_booking_id]
              properties:
                target_booking_id: { type: string, format: uuid }
      responses:
        '200':
          description: Zero or one row.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    status: { type: string, enum: [pending, confirmed, declined, cancelled, completed] }
                    start_date: { type: string, format: date }
                    end_date: { type: string, format: date, description: End-exclusive. }
                    requester_note: { type: string, nullable: true }
                    owner_note: { type: string, nullable: true }
                    created_at: { type: string, format: date-time }
                    confirmed_at: { type: string, format: date-time, nullable: true }
                    declined_at: { type: string, format: date-time, nullable: true }
                    cancelled_at: { type: string, format: date-time, nullable: true }
                    completed_at: { type: string, format: date-time, nullable: true }
                    viewer_role: { type: string, enum: [requester, owner] }
                    listing_id: { type: string, format: uuid }
                    listing_title: { type: string }
                    listing_location: { type: string }
                    listing_status: { type: string, enum: [draft, published, deleted] }
                    pet_id: { type: string, format: uuid, nullable: true }
                    pet_name: { type: string, nullable: true }
                    pet_species: { type: string, nullable: true }
                    pet_breed: { type: string, nullable: true }
                    pet_age_year: { type: integer, nullable: true }
                    pet_photo_url: { type: string, nullable: true, description: Storage path in the pet-photos bucket; sign it to display. }
                    pet_description: { type: string, nullable: true }
                    pet_feeding_instruction: { type: string, nullable: true }
                    pet_medical_note: { type: string, nullable: true }
                    pet_behavior_note: { type: string, nullable: true }
                    pet_allergies: { type: string, nullable: true }
                    pet_vaccination_info: { type: string, nullable: true }
                    pet_special_requirement: { type: string, nullable: true }
                    pet_deleted: { type: boolean, nullable: true }
                    peer_id: { type: string, format: uuid }
                    peer_display_name: { type: string }
                    peer_photo_url: { type: string, nullable: true }
                    peer_location: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rest/v1/rpc/update_listing_with_images:
    post:
      tags: [Listings]
      operationId: updateListingWithImages
      summary: Atomically edit a listing and its photo metadata
      x-rls: Listing owner only. Photo order and retained photos are changed in one transaction.
      security:
        - userJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_listing_id, new_title, new_location, new_description, new_capacity, new_accepted_pet_types, new_status]
              properties:
                target_listing_id: { type: string, format: uuid }
                new_title: { type: string, minLength: 1 }
                new_location: { type: string, minLength: 1 }
                new_description: { type: string, minLength: 1 }
                new_capacity: { type: integer, minimum: 1 }
                new_accepted_pet_types:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/PetSpecies' }
                new_facilities: { type: string, nullable: true }
                new_status: { $ref: '#/components/schemas/ListingStatus' }
                new_published_at: { type: string, format: date-time, nullable: true }
                retained_image_ids: { type: array, items: { type: string, format: uuid } }
                new_images: { type: array, items: { type: object } }
                ordered_image_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        '200': { description: Updated. }
        '400': { $ref: '#/components/responses/DatabaseError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rest/v1/rpc/delete_listing_with_active_booking_check:
    post:
      tags: [Listings]
      operationId: deleteListing
      summary: Soft-delete a listing
      x-rls: Owner only. Rejected while a pending or confirmed booking exists; terminal bookings do not block.
      security:
        - userJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_listing_id]
              properties:
                target_listing_id: { type: string, format: uuid }
      responses:
        '204': { description: Deleted. }
        '400': { $ref: '#/components/responses/DatabaseError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rest/v1/rpc/delete_pet_with_active_booking_check:
    post:
      tags: [Pets]
      operationId: deletePet
      summary: Soft-delete a pet
      x-rls: Owner only. Rejected while a pending or confirmed booking exists. A deleted pet still appears on past bookings.
      security:
        - userJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_pet_id]
              properties:
                target_pet_id: { type: string, format: uuid }
      responses:
        '200':
          description: Outcome text from the function.
          content:
            application/json:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rest/v1/bookings:
    get:
      tags: [Bookings]
      operationId: listBookings
      summary: List bookings the caller is party to
      description: Used for both outgoing requests (as requester) and incoming requests (as listing owner). PostgREST embedding adds pet and listing summaries.
      x-rls: Rows are visible only to the requester and to the owner of the listing. Unrelated users get an empty list.
      security:
        - userJwt: []
      parameters:
        - { name: select, in: query, schema: { type: string } }
        - { name: status, in: query, description: 'PostgREST filter, for example `eq.pending`.', schema: { type: string } }
        - { name: order, in: query, schema: { type: string } }
      responses:
        '200':
          description: Bookings.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Bookings]
      operationId: createBookingRequest
      summary: Request a booking (starts as pending)
      x-rls: |
        Enforced by the `guard_booking_change` trigger: the requester must be the caller, the pet
        must belong to the caller, the listing must be published and not the caller's own,
        the status must be `pending`, and the dates must be valid and not in the past.
      security:
        - userJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingInsert' }
      responses:
        '201':
          description: Created, status `pending`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/DatabaseError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Database constraint violation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatabaseError' }
    patch:
      tags: [Bookings]
      operationId: updateBookingStatus
      summary: Change a booking's status (filter with `id=eq.<uuid>`)
      description: |
        Allowed transitions: pending to confirmed or declined (listing owner), pending or
        confirmed to cancelled (requester), confirmed to completed (listing owner, on or after the
        end date). Confirming is refused with SQLSTATE `PBC01` when the listing would exceed its
        capacity on some night (peak occupancy, not overlap count), and with `PBP01` when the
        pet already has a confirmed booking for those dates on any listing (ADR 0011). The
        messages never name another booking.
        Listing, pet, requester, and dates cannot be changed after the request.
      x-rls: Actor and transition checked by the `guard_booking_change` trigger.
      security:
        - userJwt: []
      parameters:
        - { name: id, in: query, required: true, schema: { type: string, example: 'eq.00000000-0000-0000-0000-000000000000' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/BookingStatus' }
                owner_note: { type: string, nullable: true }
      responses:
        '200':
          description: 'Updated rows (use the header `Prefer: return=representation`).'
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/DatabaseError' }
        '409':
          description: Would overlap another confirmed booking (legacy exclusion-constraint path; the capacity and pet-overlap refusals are the 400 `PBC01` and `PBP01` above).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatabaseError' }

  /rest/v1/listings:
    get:
      tags: [Listings]
      operationId: listListings
      summary: Read listings (public detail page, owner's list)
      x-rls: Anyone may read published, not-deleted listings. Owners also read their own drafts. Nobody else reads drafts.
      parameters:
        - { name: select, in: query, schema: { type: string } }
        - { name: id, in: query, schema: { type: string, example: 'eq.<uuid>' } }
        - { name: owner_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: Listings.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Listing' }
    post:
      tags: [Listings]
      operationId: createListing
      summary: Create a listing (draft first, then photos, then optionally publish)
      x-rls: Owner id must be the caller. Capacity above 0, non-blank title, location, and description, and at least one accepted pet type are enforced in the database.
      security:
        - userJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Listing' }
      responses:
        '201': { description: Created. }
        '400': { $ref: '#/components/responses/DatabaseError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rest/v1/pets:
    get:
      tags: [Pets]
      operationId: listPets
      summary: Read pets
      x-rls: 'An owner reads their own pets, including soft-deleted ones (booking history). A listing owner can read a pet that has a booking at one of their listings. Known gap found on 14 Nov 2026: this host access does not yet end when the booking is declined or cancelled; the intended rule is access only while the booking is pending or confirmed, and the fix is tracked separately.'
      security:
        - userJwt: []
      responses:
        '200':
          description: Pets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pet' }
    post:
      tags: [Pets]
      operationId: createPet
      summary: Create a pet
      x-rls: Owner id must be the caller. Name and species required; age 0 to 100 if given.
      security:
        - userJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pet' }
      responses:
        '201': { description: Created. }
        '400': { $ref: '#/components/responses/DatabaseError' }
    patch:
      tags: [Pets]
      operationId: updatePet
      summary: Edit a pet (filter with `id=eq.<uuid>`)
      x-rls: Owner only. Hosts and other users cannot edit; soft-deleted pets cannot be edited or restored.
      security:
        - userJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pet' }
      responses:
        '200': { description: Updated. }
        '400': { $ref: '#/components/responses/DatabaseError' }

  /rest/v1/profiles:
    get:
      tags: [Profiles]
      operationId: getProfile
      summary: Read the caller's own profile
      x-rls: A user reads only their own row. Public host details come from `get_listing_host`.
      security:
        - userJwt: []
      responses:
        '200':
          description: Profile rows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Profile' }
    patch:
      tags: [Profiles]
      operationId: updateProfile
      summary: Edit the caller's own profile (filter with `id=eq.<uuid>`)
      x-rls: Owner only. Profiles cannot be deleted by users.
      security:
        - userJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Profile' }
      responses:
        '200': { description: Updated. }
        '400': { $ref: '#/components/responses/DatabaseError' }

components:
  securitySchemes:
    publishableKey:
      type: apiKey
      in: header
      name: apikey
      description: The public publishable (anon) key. It identifies the project; it is not a secret and grants nothing beyond what RLS allows a signed-out visitor.
    userJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token of the signed-in user, sent as `Authorization`. Send the `apikey` header too.
  responses:
    Unauthorized:
      description: Missing or expired user token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DatabaseError' }
    DatabaseError:
      description: A database rule rejected the request (validation, ownership, or a constraint).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DatabaseError' }
    SignInError:
      description: Sign-in failed; `error.code` says why without revealing whether the username exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SignInError' }
  schemas:
    PetSpecies:
      type: string
      nullable: true
      enum: [dog, cat, rabbit, hamster, guinea_pig, fish, reptile, exotic_mammal, bird, other]
    ListingStatus:
      type: string
      enum: [draft, published, deleted]
    BookingStatus:
      type: string
      enum: [pending, confirmed, declined, cancelled, completed]
    DatabaseError:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: string, nullable: true }
        hint: { type: string, nullable: true }
    SignInError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [INVALID_CREDENTIALS, EMAIL_NOT_CONFIRMED, RATE_LIMITED, UNKNOWN]
    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string, minLength: 1 }
        username: { type: string, pattern: '^[a-z0-9_]{3,30}$' }
        photo_url: { type: string, nullable: true }
        phone_number: { type: string, nullable: true }
        location: { type: string, nullable: true }
    Pet:
      type: object
      required: [name, species]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        owner_id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        species: { $ref: '#/components/schemas/PetSpecies' }
        breed: { type: string, nullable: true }
        age_year: { type: integer, minimum: 0, maximum: 100, nullable: true }
        description: { type: string, nullable: true }
        feeding_instruction: { type: string, nullable: true }
        medical_note: { type: string, nullable: true }
        behavior_note: { type: string, nullable: true }
        allergies: { type: string, nullable: true }
        vaccination_info: { type: string, nullable: true }
        special_requirement: { type: string, nullable: true }
    Listing:
      type: object
      required: [title, location, description, capacity, accepted_pet_types]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        owner_id: { type: string, format: uuid }
        title: { type: string, minLength: 1 }
        location: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        capacity: { type: integer, minimum: 1 }
        accepted_pet_types:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PetSpecies' }
        facilities: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ListingStatus' }
        published_at: { type: string, format: date-time, nullable: true }
    ListingSearchRow:
      allOf:
        - $ref: '#/components/schemas/Listing'
        - type: object
          properties:
            page_number: { type: integer }
            total_count: { type: integer, format: int64 }
    BookingInsert:
      type: object
      required: [listing_id, pet_id, requester_id, start_date, end_date]
      properties:
        listing_id: { type: string, format: uuid }
        pet_id: { type: string, format: uuid }
        requester_id: { type: string, format: uuid, description: Must equal the caller. }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, description: End-exclusive; must be later than `start_date`. }
        requester_note: { type: string, nullable: true }
    Booking:
      allOf:
        - $ref: '#/components/schemas/BookingInsert'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/BookingStatus' }
            owner_note: { type: string, nullable: true }
            confirmed_at: { type: string, format: date-time, nullable: true }
